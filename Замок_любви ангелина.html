<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Замок любви</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marck+Script&display=swap">
<style>
:root{--bg1:#ff7eb0;--bg2:#b84fb8;--lock1:#f46d93;--lock2:#e0527c;--panel:#ffc2d1;--wheel:#6b3a26;--wheelText:#fff3e6;--shackle:#f3dfe6;--text:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#5a1b3a;--bg2:#2e1042;--lock1:#d44f77;--lock2:#a8365a;--panel:#e8a3b6;--shackle:#cdb3bd;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#5a1b3a;--bg2:#2e1042;--lock1:#d44f77;--lock2:#a8365a;--panel:#e8a3b6;--shackle:#cdb3bd;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(135deg,var(--bg1),var(--bg2));font-family:Georgia,serif;color:var(--text);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.bg{position:fixed;inset:0;pointer-events:none;opacity:.25;font-size:26px;line-height:56px;word-break:break-all;overflow:hidden;color:#fff;letter-spacing:22px}
.wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;padding:20px}
.shackle{width:min(190px,50vw);height:110px;border:22px solid var(--shackle);border-bottom:0;border-radius:100px 100px 0 0;margin-bottom:-4px;transition:transform .8s ease;transform-origin:right bottom}
.open .shackle{transform:translateY(-30px) rotate(-25deg)}
.body{background:linear-gradient(160deg,var(--lock1),var(--lock2));border-radius:22px;padding:26px 24px 22px;width:min(340px,92vw);box-shadow:0 20px 40px rgba(0,0,0,.3);text-align:center}
.panel{background:var(--panel);border-radius:16px;padding:18px 10px 12px;box-shadow:inset 0 3px 8px rgba(0,0,0,.2)}
.digits{display:flex;gap:8px;justify-content:center;align-items:center}.dot{width:10px;height:10px;border-radius:50%;background:var(--wheel);flex:none}
.col{display:flex;flex-direction:column;align-items:center;gap:6px}
.num{width:50px;height:60px;background:var(--wheel);color:var(--wheelText);border-radius:10px;font-size:2rem;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 2px 6px rgba(0,0,0,.5)}
.col button{width:50px;height:40px;border:0;border-radius:8px;background:var(--wheel);color:var(--wheelText);cursor:pointer;font-size:20px;padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.col button:active{transform:scale(.92)}
.msg{margin:16px 0 0;font-style:italic;font-size:1.15rem;min-height:1.6em}
.shake{animation:sh .4s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.secret{margin-top:22px;max-width:340px;text-align:center;line-height:1.7;opacity:0;transition:opacity 1s;height:0;overflow:hidden}
.open .secret{opacity:1;height:auto}
.heart{position:fixed;bottom:-30px;z-index:0;pointer-events:none;animation:up linear forwards}
@keyframes up{to{transform:translateY(-110vh) rotate(40deg);opacity:0}}
.next{margin-top:16px;background:#d6174f;color:#fff;border:0;border-radius:10px;padding:13px 34px;font-size:1.1rem;font-family:inherit;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.25);touch-action:manipulation}.next:active{transform:scale(.96)}
:root{--qcard:#f7f4ee;--qtext:#d6174f;--qinput:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--qcard:#3a2230;--qinput:#2a1620}}
:root[data-theme="dark"]{--qcard:#3a2230;--qinput:#2a1620}
.quiz{display:none;position:relative;z-index:1;width:min(360px,92vw);padding:10px}
.quiz.show{display:block}
.qcard{background:var(--qcard);border-radius:22px;padding:30px 20px 26px;text-align:center;transform:rotate(-3deg);box-shadow:0 20px 40px rgba(0,0,0,.25)}
.qcard h2{font-family:'Marck Script',cursive;font-weight:400;color:var(--qtext);font-size:2rem;margin:0 0 18px;line-height:1.2}
.qcard input{width:100%;padding:14px;border:2px solid #d6174f;border-radius:10px;background:var(--qinput);color:#d6174f;-webkit-text-fill-color:#d6174f;caret-color:#d6174f;font-size:1.15rem;font-family:inherit;text-align:center;outline:0}
.qcard input::placeholder{color:#e89ab3;-webkit-text-fill-color:#e89ab3}
.qcard #qmsg{margin:14px 0 0;color:var(--qtext);font-size:1.05rem;min-height:1.4em;line-height:1.5}
.love{display:none;position:relative;z-index:1;width:min(360px,92vw);padding:10px}
.love.show{display:block}
.lcard{background:var(--qcard);border-radius:22px;padding:24px 20px 28px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.25)}
.lcard svg{width:170px;height:auto}
.lcard h1{font-family:Georgia,serif;font-weight:900;color:#c4122f;font-size:2.2rem;margin:4px 0 6px;letter-spacing:1px}
.lcard .ask2{color:#c4122f;font-size:1.35rem;margin:0 0 20px;font-weight:600}
.round{width:64px;height:64px;border-radius:50%;border:0;background:#c4122f;color:#fff;font-size:2rem;margin:0 10px;cursor:pointer;transition:transform .25s;touch-action:manipulation;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.lfinal{color:#c4122f;font-size:1.2rem;line-height:1.6;margin:0}
.lcard .catpic{width:190px;max-width:70%;height:auto;display:block;margin:0 auto;filter:drop-shadow(0 6px 8px rgba(0,0,0,.2))}
.player{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;z-index:20;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.28);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:999px;padding:6px 14px 6px 6px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.player button{width:38px;height:38px;border-radius:50%;border:0;background:#d6174f;color:#fff;font-size:17px;cursor:pointer;padding:0;touch-action:manipulation}
.player input[type=range]{width:90px;accent-color:#d6174f;touch-action:manipulation}

.rscreen{display:none;position:relative;z-index:1;width:min(380px,94vw);padding:10px}
.rscreen.show{display:block}
.rcard{background:var(--qcard);border-radius:22px;padding:24px 16px 20px;box-shadow:0 20px 40px rgba(0,0,0,.25);display:flex;flex-direction:column;max-height:calc(100vh - 40px);max-height:calc(100dvh - 40px)}
.rcard h2{font-family:'Marck Script',cursive;font-weight:400;color:var(--qtext);font-size:1.9rem;margin:0 0 4px;line-height:1.2;text-align:center}
.rcount{text-align:center;color:var(--qtext);font-size:.95rem;margin:0 0 12px;opacity:.8}
.rlist{list-style:none;counter-reset:r;margin:0 0 14px;padding:0 4px 0 0;overflow-y:auto;flex:1 1 auto;min-height:60px;-webkit-overflow-scrolling:touch}
.rlist li{counter-increment:r;display:flex;align-items:flex-start;gap:8px;color:var(--qtext);font-size:1.05rem;line-height:1.4;padding:7px 0;border-bottom:1px dashed rgba(214,23,79,.3);word-break:break-word}
.rlist li::before{content:counter(r)'.';font-weight:700;min-width:2.1em;text-align:right;flex:none}
.rlist li span{flex:1}
.rlist li button{border:0;background:none;color:var(--qtext);opacity:.45;cursor:pointer;font-size:14px;padding:2px 6px;flex:none;touch-action:manipulation}
.rempty{color:var(--qtext);text-align:center;opacity:.7;margin:10px 0 18px;font-style:italic}
.radd{display:flex;gap:8px;flex:none}
.radd input{flex:1;min-width:0;padding:12px;border:2px solid #d6174f;border-radius:10px;background:var(--qinput);color:#d6174f;-webkit-text-fill-color:#d6174f;caret-color:#d6174f;font-size:1.05rem;font-family:inherit;outline:0}
.radd input::placeholder{color:#e89ab3;-webkit-text-fill-color:#e89ab3}
.radd .next{margin:0;padding:12px 16px;font-size:1rem}
.radd input:disabled,.radd .next:disabled{opacity:.5}
.rnav{display:flex;gap:10px;justify-content:center;margin-top:12px;flex:none}
.rnav .next{margin:0;padding:10px 26px;font-size:1rem}
.rnav .back{background:transparent;color:var(--qtext);border:2px solid #d6174f;box-shadow:none}
.rsend{display:block;width:100%;margin-top:10px;background:none;border:0;color:var(--qtext);text-decoration:underline;font-family:inherit;font-size:.95rem;cursor:pointer;padding:4px;flex:none;touch-action:manipulation}
.elist{overflow-y:auto;flex:1 1 auto;min-height:60px;margin-bottom:6px;-webkit-overflow-scrolling:touch}
.envbtn{display:block;width:100%;margin:0 0 10px;background:#d6174f;color:#fff;border:0;border-radius:14px;padding:15px 12px;font-family:inherit;font-size:1.1rem;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.2);touch-action:manipulation}
.envbtn:active{transform:scale(.97)}
.eview{display:none;overflow-y:auto;flex:1 1 auto;text-align:center;color:var(--qtext);-webkit-overflow-scrolling:touch}
.eview h3{font-family:'Marck Script',cursive;font-weight:400;font-size:1.9rem;margin:0 0 10px}
.eview img{max-width:100%;max-height:38vh;border-radius:14px;margin:0 auto 12px;display:block;box-shadow:0 6px 14px rgba(0,0,0,.2)}
.eview p{white-space:pre-line;font-size:1.1rem;line-height:1.55;margin:0 0 14px}
.eview audio{width:100%;margin:0 0 14px}
</style>
</head>

<script>
// Секретный код (4 цифры). Поменяй на свой:
var CODE=[2,3,1,2];
var vals=[0,0,0,0],done=false;
var bg=document.getElementById('bg');bg.textContent='♥ ♡ '.repeat(900);
var dg=document.getElementById('digits'),nums=[];
for(let i=0;i<4;i++){
  var c=document.createElement('div');c.className='col';
  c.innerHTML='<button aria-label="вверх">↑</button><div class="num">0</div><button aria-label="вниз">↓</button>';
  var b=c.querySelectorAll('button');
  nums.push(c.querySelector('.num'));
  b[0].onclick=function(){step(i,1)};
  b[1].onclick=function(){step(i,-1)};
  dg.appendChild(c);
  if(i===1){var dt=document.createElement('div');dt.className='dot';dg.appendChild(dt);}
}
function step(i,d){
  if(done)return;
  vals[i]=(vals[i]+d+10)%10;nums[i].textContent=vals[i];
  document.getElementById('msg').textContent='Введи нашу дату ❤';
}
function next(){
  if(done)return;
  if(vals.join('')===CODE.join('')){
    done=true;
    document.getElementById('wrap').classList.add('open');
    document.getElementById('msg').textContent='Правильный ответ! 💖';
    for(var k=0;k<30;k++)setTimeout(heart,k*70);
    setTimeout(function(){
      document.getElementById('wrap').style.display='none';
      document.getElementById('quiz').classList.add('show');
    },2200);
  }else{
    document.getElementById('body').dispatchEvent(new Event('shakeit'));
  }
}
document.getElementById('next').onclick=next;
var solved=false;
function check(){
  if(solved)return;
  var a=document.getElementById('ans').value.toLowerCase().replace(/[\s.\-]/g,'');
  var q=document.getElementById('qmsg');
  if(['нектоми','nektome'].indexOf(a)>=0){
    solved=true;
    q.textContent='Правильно! 💖';
    for(var k=0;k<40;k++)setTimeout(heart,k*70);
    setTimeout(function(){
      document.getElementById('quiz').classList.remove('show');
      document.getElementById('love').classList.add('show');
    },1800);
  }else{
    q.textContent='Неправильно, подумай ещё 😉';
  }
}
document.getElementById('qbtn').onclick=check;

var LISTS={};
function initList(pre,key,max,emptyText,countFn,fullText){
  var arr=[];
  try{arr=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){arr=[]}
  if(!Array.isArray(arr))arr=[];
  LISTS[pre]=arr;
  var ol=document.getElementById(pre+'list'),inp=document.getElementById(pre+'inp'),btn=document.getElementById(pre+'add'),cnt=document.getElementById(pre+'count');
  function save(){try{localStorage.setItem(key,JSON.stringify(arr))}catch(e){}}
  function render(){
    ol.innerHTML='';
    if(!arr.length){var p=document.createElement('p');p.className='rempty';p.textContent=emptyText;ol.appendChild(p);}
    arr.forEach(function(t,i){
      var li=document.createElement('li'),sp=document.createElement('span'),x=document.createElement('button');
      sp.textContent=t;x.textContent='✕';x.setAttribute('aria-label','Удалить');
      x.onclick=function(){arr.splice(i,1);save();render()};
      li.appendChild(sp);li.appendChild(x);ol.appendChild(li);
    });
    var full=max&&arr.length>=max;
    cnt.textContent=full?fullText:countFn(arr.length);
    inp.disabled=!!full;btn.disabled=!!full;
  }
  function add(){
    var t=inp.value.trim();
    if(!t||(max&&arr.length>=max))return;
    arr.push(t);save();inp.value='';render();
    ol.scrollTop=ol.scrollHeight;heart();
    if(max&&arr.length>=max)for(var k=0;k<40;k++)setTimeout(heart,k*70);
    else inp.focus();
  }
  btn.onclick=add;
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')add()});
  render();
  return render;
}

// ====== ОТПРАВИТЬ ЕМУ ======
function collectAll(){
  var parts=[['r','💖 100 причин, почему я тебя люблю'],['m','🎵 Наша любимая музыка'],['w','🎁 Банк желаний']],out=[];
  parts.forEach(function(p){
    var a=LISTS[p[0]]||[];
    out.push(p[1]+(a.length?'':' — пока пусто'));
    a.forEach(function(t,i){out.push((i+1)+'. '+t)});
    out.push('');
  });
  return out.join('\n').trim();
}
function sendAll(btn){
  var text=collectAll(),orig=btn.textContent;
  function note(m){btn.textContent=m;setTimeout(function(){btn.textContent=orig},2500)}
  if(navigator.share){
    navigator.share({title:'Мои ответы ❤',text:text}).catch(function(){});
  }else if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){note('Скопировано — вставь ему в чат ❤')},function(){window.prompt('Скопируй и отправь ему:',text)});
  }else{
    window.prompt('Скопируй и отправь ему:',text);
  }
}
Array.prototype.forEach.call(document.querySelectorAll('.rsend'),function(b){b.onclick=function(){sendAll(b)}});

var song=document.getElementById('song'),mbtn=document.getElementById('mbtn'),vol=document.getElementById('vol');
var manualOff=false;
song.volume=0.6;
function sync(){mbtn.textContent=song.paused?'▶':'⏸'}
function play(){var p=song.play();if(p&&p.catch)p.catch(function(){});setTimeout(sync,100)}
mbtn.addEventListener('click',function(e){e.stopPropagation();
  if(song.paused){manualOff=false;play()}else{manualOff=true;song.pause();sync()}});
vol.addEventListener('input',function(){song.volume=parseFloat(vol.value)});
document.addEventListener('pointerdown',function f(e){
  if(e.target.closest&&e.target.closest('.player'))return;
  if(!manualOff&&song.paused)play();
  document.removeEventListener('pointerdown',f)});
song.addEventListener('play',sync);song.addEventListener('pause',sync);
</script>
